name: test

# WHY THIS EXISTS. Without a test workflow, a version tag publishes without anything ever having run
# the suite or installed the package. Scripts can drift with the INSTALLED copy ahead of the repo, and
# a suite that exercises the installed copies makes a drifted install look like a passing repo.
#
# So this workflow does the two things a green unit test cannot do on its own: it RUNS THE REAL
# INSTALLER, and it inspects the BUILT PAYLOADS for the files each provider needs. A packaging
# manifest that forgets a provider is invisible to every other check in the repo.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Bound the job so a wedged step cannot hold a runner for GitHub's 6 h default. The whole job
    # takes a few minutes, so a timeout here is a real hang, never a slow-but-healthy run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jq is required by the Claude installer; tmux by the lifecycle suite's stand-in panes.
      - run: sudo apt-get update && sudo apt-get install -y jq tmux

      # --selftest first proves no conformance matcher can match an empty document, because a prose
      # check that accepts anything reports green forever.
      - name: shared doctrine across every provider
        run: bash tests/conformance_test.sh --selftest

      # The Codex provider's executable surface is the wake helper.
      - name: codex wake-helper suite
        run: |
          node --test providers/codex/wake-helper/kijito-wake-helper.test.mjs \
                       providers/codex/wake-helper/integration.test.mjs

      - name: codex gated hashes are current
        run: node providers/codex/tools/refresh-manifest.mjs --check

      # The release gate itself, both failure directions loud: gated-but-absent and
      # ungated-but-shipped each fail this run.
      - name: codex release verify
        run: node providers/codex/install.mjs

      # Runs the actual installer, then asserts the machine matches the repo, so an installed copy
      # that drifted from the repo fails here.
      # --allow-branch: CI checks out the PR branch and MEANS to install exactly its bytes (drift_test
      # then asserts machine==repo). The rollout guard refuses a bare off-main install so a machine
      # cannot SILENTLY converge on a feature branch; CI is the deliberate off-main case, so it opts in.
      - name: install the claude provider, then prove no drift
        run: |
          ./install.sh --allow-branch
          bash tests/drift_test.sh
      - name: first-time install path - installer output, --persona and the inbox start helper
        run: |
          bash tests/install_stranger_path_test.sh
          bash tests/persona_flag_test.sh
          bash tests/inbox_start_test.sh
          bash tests/no_operator_endpoints_test.sh

      - name: codex skills deploy
        run: |
          node providers/codex/install.mjs --skills-only --skills-root "$HOME/.codex/skills"
          test -f "$HOME/.codex/skills/kijito-start/SKILL.md"
          test -f "$HOME/.codex/skills/kijito-start/agents/openai.yaml"

      # The skill names ONE absolute wake-helper path; a packed install into a fresh HOME
      # (npm install --prefix + npx --skills-only) proves that path exists and runs.
      - name: codex wake helper path agrees with the installed package
        run: bash tests/codex_wake_helper_path_test.sh

      - name: lifecycle suite
        run: |
          bash tests/lc_test.sh
          bash tests/wtmux_lifecycle_test.sh
          bash tests/arm_status_self_test.sh
          bash tests/autosend_owner_test.sh
          bash tests/remote_control_optin_test.sh
      - name: heartbeat, inbox self-test and status-line suites
        run: |
          bash tests/heartbeat_nonce_test.sh
          bash tests/heartbeat_watchdog_test.sh
          bash tests/inbox_selftest_test.sh
          bash tests/statusline_persona_test.sh
          bash tests/statusline_render_test.sh
          bash tests/stream_layouts_test.sh
          bash tests/windows_detect_test.sh
          bash tests/catchup_topology_test.sh
          bash tests/kijito_start_watched_test.sh --mutation
          bash tests/armed_token_precedence_test.sh --mutation
      - name: vendored monitor is byte-identical to its recorded upstream release, and its own suite passes
        run: |
          bash tests/vendored_monitor_test.sh
          cd providers/monitor && python3 -m unittest -q test_kijito_monitor

      # A packaging manifest that drops a provider breaks users and nothing else. There are four
      # manifests (npm files[], wheel force-include, sdist include, and the installer's own
      # iteration), so the payloads themselves are the only honest check.
      # LEAK_PATHS: repository-only paths that must never ship, relative to the package root:
      # tests, repo tooling, CI config, and paths that are no longer part of the tree at all
      # (legacy/, the removed Codex maintainer material and Python modules), so a stale checkout or a
      # mis-anchored include cannot quietly bring them back.
      - name: built payloads carry every provider
        env:
          LEAK_PATHS: '(legacy/|tests/|scripts/|\.github/|(src/)?kijito_tools/d1|providers/codex/(test/|plans/|n0-harness/|[^/]*plan[^/]*\.md$|n0-capability-probe-protocol\.md$|wake-helper/TRANSPORT-NOTES\.md$))'
        run: |
          set -euo pipefail
          npm pack --silent >/dev/null
          TGZ=$(ls kijito-tools-*.tgz)
          # ⛔ MATERIALIZE THE LISTING ONCE; DO NOT PIPE `tar` INTO `grep -q`.
          # `grep -q` exits at its first match, `tar` then dies writing the remainder (EPIPE), and
          # under `set -o pipefail` the pipeline reports TAR's failure -- so a file that IS present
          # reports MISSING. Measured here: package/NOTICE is entry 2 of 35, leaving 33 entries
          # unwritten, so it falsely FAILED while package/install.sh at entry 24 passed. And the
          # negative check below inverts: a real leak makes grep exit early, tar fail, the pipeline
          # non-zero, and the `if` take the ELSE branch -- silently passing the leak.
          # It does NOT reproduce on macOS/BSD tar, so this can only be caught on the runner.
          tar tzf "$TGZ" > /tmp/npm-payload.txt
          for f in install.sh NOTICE \
                   providers/claude/install.sh \
                   providers/claude/scripts/self-clear.sh \
                   providers/claude/skills/kijito-qa-memory/SKILL.md \
                   providers/codex/install.mjs \
                   providers/codex/release-manifest.json \
                   providers/codex/wake-helper/kijito-wake-helper.mjs \
                   providers/codex/wake-helper/ws-uds.mjs \
                   providers/codex/wake-helper/kijito-wake-helper.test.mjs \
                   providers/codex/wake-helper/integration.test.mjs \
                   providers/codex/wake-helper/mock-daemon.mjs \
                   providers/codex/skills/kijito-start/SKILL.md \
                   providers/codex/skills/kijito-qa-memory/agents/openai.yaml \
                   providers/_shared/wake-core.mjs; do
            grep -qx "package/$f" /tmp/npm-payload.txt || { echo "MISSING from npm payload: $f"; exit 1; }
          done
          # Repository-only material never ships. Same intent as package.json files[], hatch_build.py
          # and the anchored sdist include list.
          if grep -E "^package/$LEAK_PATHS" /tmp/npm-payload.txt > /tmp/npm-leak.txt; then
            echo "repository-only material leaked into the npm payload:"; cat /tmp/npm-leak.txt; exit 1
          fi
          echo "npm payload: $(wc -l < /tmp/npm-payload.txt) entries, all required files present"
          pipx run build >/dev/null
          python3 - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          need = [
              "kijito_tools/_assets/install.sh",
              "kijito_tools/_assets/providers/claude/install.sh",
              "kijito_tools/_assets/providers/claude/skills/kijito-qa-memory/SKILL.md",
              "kijito_tools/_assets/providers/codex/install.mjs",
              "kijito_tools/_assets/providers/codex/release-manifest.json",
              "kijito_tools/_assets/providers/codex/wake-helper/kijito-wake-helper.mjs",
              "kijito_tools/_assets/providers/codex/wake-helper/ws-uds.mjs",
              "kijito_tools/_assets/providers/codex/skills/kijito-start/SKILL.md",
              "kijito_tools/_assets/providers/_shared/wake-core.mjs",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("MISSING from wheel: " + ", ".join(missing))
          import re, tarfile
          # The same repository-only set must be absent from the wheel AND the sdist.
          # Wheel assets sit under kijito_tools/_assets/ (the package itself at the wheel root); sdist
          # names sit under one top-level directory, so each is anchored at its own root.
          import os
          paths = os.environ["LEAK_PATHS"]
          wheel_leak = re.compile(r"^(kijito_tools/_assets/)?" + paths)
          sdist_leak = re.compile(r"^[^/]+/" + paths)
          sdist = glob.glob("dist/*.tar.gz")[0]
          leaked = [n for n in names if wheel_leak.search(n)] + [n for n in tarfile.open(sdist).getnames() if sdist_leak.search(n)]
          if leaked:
              sys.exit("repository-only material leaked into the wheel/sdist: " + ", ".join(leaked))
          print(f"wheel {whl}: all provider assets present, no repository-only material (wheel + sdist)")
          PY

      # The installer must work from the built package, not only from a clone -- that is the path
      # npx and pipx users actually take.
      - name: smoke-install the built npm payload into a throwaway HOME
        run: |
          set -euo pipefail
          TGZ=$(ls kijito-tools-*.tgz)
          SMOKE=$(mktemp -d); mkdir -p "$SMOKE/home" "$SMOKE/pkg"
          tar xzf "$TGZ" -C "$SMOKE/pkg" --strip-components=1
          HOME="$SMOKE/home" bash "$SMOKE/pkg/install.sh"
          test -f "$SMOKE/home/.claude/skills/kijito-qa-memory/SKILL.md"
          HOME="$SMOKE/home" bash "$SMOKE/pkg/install.sh" --provider codex --skills-only \
            --skills-root "$SMOKE/home/.codex/skills"
          test -f "$SMOKE/home/.codex/skills/kijito-qa-memory/SKILL.md"
          echo "both providers install from the built payload"
