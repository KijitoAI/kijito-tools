[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kijito-claude"
version = "0.1.2"
description = "Installer for the kijito-claude toolkit: context tracking, session catch-up, and self-clear scripts plus the Kijito skills, deployed into ~/.claude."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Arcada Labs", email = "jason@arcadalabs.com" }]
keywords = ["kijito", "claude", "claude-code", "anthropic", "installer", "cli", "skills"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/KijitoAI/kijito-claude"
Repository = "https://github.com/KijitoAI/kijito-claude"
"Bug Tracker" = "https://github.com/KijitoAI/kijito-claude/issues"

[project.scripts]
kijito-claude = "kijito_claude.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kijito_claude"]

# The per-provider payloads (bash scripts, skills, each provider's own installer) and the
# repo-root dispatcher live outside src/ so the tree doubles as the git-clone install path. Pull
# them into the wheel under the package so importlib.resources can find them at runtime.
#
# ⚠️ providers/ MUST be included WHOLESALE, not enumerated per provider. Two reasons, both
# measured: (1) the codex installer hash-gates providers/codex/test/codex-hive-watch.test.mjs, so
# omitting the tests from the payload makes every codex install throw; (2) an enumerated list is a
# fifth place to forget when a provider is added, and this repo already carries four.
[tool.hatch.build.targets.wheel.force-include]
"providers" = "kijito_claude/_assets/providers"
"install.sh" = "kijito_claude/_assets/install.sh"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "providers/",
  "install.sh",
  "README.md",
  "LICENSE",
  "NOTICE",
]
